; TO stage bonus time per map. Obj is 1-based; Bonus is seconds added when that stage completes.
[BangModVanilla.BangModVanillaObjTimer]
;+Overrides=(Map="AOCTO-MapName_p",Obj=2,Bonus=900)

; TO maps whose King is a bot (BangModVanillaKingBot) instead of the top-scoring defender.
; Comma-separated; each entry is matched inside the map's title or file name, ignoring case and punctuation.
[BangModVanilla.BangModVanillaAIKing]
Maps=Stoneshill,KingsGarden
; bDisabled=true keeps Kings human by default; admins can still switch per match with AdminAIKing on|off.
bDisabled=false

; Bot brain. FollowMaps: maps where idle bots trail a teammate, same matching as above; * = every map.
; bAlwaysSprint: bots hold sprint the whole time instead of only when chasing.
; bMuteBattlecry: bots never do the vanilla battlecry.
[BangModVanilla.BangModVanillaBotBrain]
FollowMaps=*
bAlwaysSprint=true
bMuteBattlecry=true

